<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Formulário de cadastro de usuários">
    <title>Aula 1 - Cadastro de usuário</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #365cf5;
            --bs-primary-rgb: 54, 92, 245;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            background: #f4f7fb;
        }

        .page-header {
            background: linear-gradient(135deg, #182848 0%, #365cf5 100%);
            color: #fff;
        }

        .form-card {
            margin-top: -2.5rem;
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(24, 40, 72, .12);
        }

        .section-title {
            color: #182848;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .form-control,
        .form-select {
            min-height: 2.9rem;
            border-color: #dce3ee;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #365cf5;
            box-shadow: 0 0 0 .25rem rgba(54, 92, 245, .12);
        }

        .required::after {
            content: " *";
            color: #dc3545;
        }
    </style>
</head>
<body>
    <header class="page-header py-5">
        <div class="container">
            <p class="mb-2 text-white-50 fw-semibold text-uppercase small">UserSystem</p>
            <h1 class="display-6 fw-bold mb-2">Cadastro de usuário</h1>
            <p class="mb-0 text-white-50">Preencha os dados abaixo para cadastrar um novo usuário.</p>
        </div>
    </header>

    <main class="container pb-5">
        <div class="card form-card">
            <div class="card-body p-4 p-md-5">
                <form id="formCadastro">
                    <section class="mb-4">
                        <h2 class="section-title border-bottom pb-3 mb-4">Dados pessoais</h2>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="nome" class="form-label required">Nome completo</label>
                                <input type="text" class="form-control" id="nome" name="nome"
                                    placeholder="Digite o nome completo" autocomplete="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="cpf" class="form-label required">CPF</label>
                                <input type="text" class="form-control" id="cpf" name="cpf"
                                    placeholder="000.000.000-00" inputmode="numeric"
                                    autocomplete="off" maxlength="14" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label required">E-mail</label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="nome@exemplo.com" autocomplete="email" required>
                            </div>
                        </div>
                    </section>

                    <section>
                        <h2 class="section-title border-bottom pb-3 mb-4">Endereço</h2>
                        <div class="row g-3">
                            <div class="col-md-4 col-lg-3">
                                <label for="cep" class="form-label required">CEP</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="cep" name="cep"
                                        placeholder="00000-000" inputmode="numeric"
                                        autocomplete="postal-code" maxlength="9" required>
                                </div>
                            </div>
                            <div class="col-md-8 col-lg-5">
                                <label for="logradouro" class="form-label required">Logradouro</label>
                                <input type="text" class="form-control" id="logradouro" name="logradouro"
                                    placeholder="Rua, avenida..." autocomplete="street-address" required>
                            </div>
                            <div class="col-md-4 col-lg-2">
                                <label for="numero" class="form-label required">Número</label>
                                <input type="text" class="form-control" id="numero" name="numero"
                                    placeholder="Ex.: 123" inputmode="numeric" autocomplete="address-line2" required>
                            </div>
                            <div class="col-md-6 col-lg-4">
                                <label for="bairro" class="form-label required">Bairro</label>
                                <input type="text" class="form-control" id="bairro" name="bairro"
                                    placeholder="Digite o bairro" required>
                            </div>
                            <div class="col-md-6 col-lg-3">
                                <label for="estado" class="form-label required">Estado</label>
                                <input type="text" class="form-control" id="estado" name="estado"
                                    placeholder="Digite o estado" autocomplete="address-level1" required>
                            </div>
                            <div class="col-md-6 col-lg-5">
                                <label for="cidade" class="form-label required">Cidade</label>
                                <input type="text" class="form-control" id="cidade" name="cidade"
                                    placeholder="Digite a cidade" autocomplete="address-level2" required>
                            </div>
                        </div>
                    </section>

                    <div class="d-flex justify-content-end gap-2 mt-5 pt-4 border-top">
                        <button type="reset" class="btn btn-light px-4">Limpar</button>
                        <button type="submit" class="btn btn-primary px-4">Cadastrar usuário</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
